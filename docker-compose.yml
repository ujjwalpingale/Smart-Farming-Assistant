version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smart_farming_mysql
    restart: always
    environment:
      MYSQL_DATABASE: smart_farming_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: smart_farming_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=production-secret-key-change-me
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - MYSQL_DATABASE=smart_farming_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
    depends_on:
      - db

volumes:
  mysql_data:
