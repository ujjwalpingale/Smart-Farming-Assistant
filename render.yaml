services:
  - type: web
    name: smart-farming-assistant
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn smart_farming.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
